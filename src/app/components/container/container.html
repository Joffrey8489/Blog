<section class="w-full bg-gray-100 px-6 py-16">

  <!-- Título -->
  <div class="mx-auto mb-12 max-w-6xl text-center">

    <h2 class="text-4xl font-bold text-gray-900">
      Publicações
    </h2>

    <p class="mt-3 text-lg text-gray-600">
      Algumas actividades e momentos recentes.
    </p>

  </div>

  <!-- Grid -->
  <div
    class="mx-auto grid max-w-7xl grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3"
  >

    @for (post of publicacoes; track $index) {

      <article
        class="overflow-hidden rounded-3xl bg-white shadow-lg
               transition-all duration-300
               hover:-translate-y-2 hover:shadow-2xl"
      >

        <!-- Imagem -->
        <div class="relative h-80 overflow-hidden">

          <img
            [src]="post.imagem"
            [alt]="post.descricao"
            class="h-full w-full object-cover
                   transition duration-500 hover:scale-105"
          />

          <!-- Descrição sobre a imagem -->
          <div
            class="absolute bottom-0 left-0 right-0
                   bg-gradient-to-t from-black/90 via-black/50 to-transparent
                   p-4"
          >

            <p class="text-lg font-medium text-white">
              {{ post.descricao }}
            </p>

          </div>

        </div>

        <!-- Rodapé -->
        <div class="p-5">

          <div
            class="flex items-center justify-between
                   text-sm text-gray-600"
          >

            <!-- Data e Local -->
            <div class="flex flex-col gap-2">

              <span class="flex items-center gap-2">
                <i class="fa-regular fa-calendar text-blue-600"></i>
                {{ post.data }}
              </span>

              <span class="flex items-center gap-2">
                <i class="fa-solid fa-location-dot text-blue-600"></i>
                {{ post.local }}
              </span>

            </div>

            <!-- Comentários e Likes -->
            <div class="flex items-center gap-5">

              <span
                class="flex items-center gap-2
                       text-blue-600 font-medium"
              >
                <i class="fa-regular fa-comment text-lg"></i>
                {{ post.comentarios }}
              </span>

              <span
                class="flex items-center gap-2
                       text-red-500 font-medium"
              >
                <i class="fa-regular fa-heart text-lg"></i>
                {{ post.likes }}
              </span>

            </div>

          </div>

        </div>

      </article>

    }

  </div>

</section>
